<!DOCTYPE html>
<html>
<head>
  <title>Location Picker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body { margin: 0; font-family: Arial; }
    #map { height: 80vh; width: 100vw; }
    #bottom {
      height: 20vh;
      padding: 12px;
      background: white;
      box-sizing: border-box;
    }
    #address {
      margin-bottom: 10px;
      font-size: 14px;
      color: #1A2530;
      height: 45px;
      overflow: hidden;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #5B9EE1;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="map"></div>

<div id="bottom">
  <div id="address">Detecting location...</div>
  <button onclick="sendToApp()">Use This Location</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let selectedLat = 21.1702;
let selectedLng = 72.8311;
let selectedAddress = '';


const map = L.map('map').setView([selectedLat, selectedLng], 13);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
  maxZoom: 19
}).addTo(map);

const marker = L.marker([selectedLat, selectedLng], {
  draggable: true
}).addTo(map);

async function getAddress(lat, lng) {
  try {
    document.getElementById('address').innerText = 'Getting address...';
    const res = await fetch(
      'https://nominatim.openstreetmap.org/reverse?format=json&lat=' +
      lat +
      '&lon=' +
      lng
    );

    const data = await res.json();

    selectedAddress = data.display_name || 'Address not found';
    document.getElementById('address').innerText = selectedAddress;
  } catch (error) {
    selectedAddress = '';
    document.getElementById('address').innerText = 'Address not found';
  }
}

function setLocation(lat, lng) {
  selectedLat = lat;
  selectedLng = lng;

  marker.setLatLng([lat, lng]);
  map.setView([lat, lng], 16);

  getAddress(lat, lng);
}

function detectCurrentLocation() {
  if (!navigator.geolocation) {
    document.getElementById('address').innerText = 'Geolocation not supported';
    getAddress(selectedLat, selectedLng);
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      setLocation(pos.coords.latitude, pos.coords.longitude);
    },
    function(error) {
      document.getElementById('address').innerText =
        'Location permission denied or GPS off';

      getAddress(selectedLat, selectedLng);
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}

marker.on('dragend', function () {
  const pos = marker.getLatLng();
  setLocation(pos.lat, pos.lng);
});

map.on('click', function (e) {
  setLocation(e.latlng.lat, e.latlng.lng);
});

function sendToApp() {
  const data = {
    latitude: selectedLat,
    longitude: selectedLng,
    address: selectedAddress
  };

  if (window.ReactNativeWebView) {
    window.ReactNativeWebView.postMessage(JSON.stringify(data));
  } else {
    alert(JSON.stringify(data));
  }
}

detectCurrentLocation();
</script>

</body>
</html>
